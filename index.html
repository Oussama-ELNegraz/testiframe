<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>YouTube Trailer</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            background: #000;
        }
    </style>
</head>
<body>
<iframe
    id="player"
    src="about:blank"
    frameborder="0"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
</iframe>
<script>
(function () {
    var match = location.search.match(/[?&]v=([^&]+)/);
    var videoId = match ? decodeURIComponent(match[1]) : '';
    var player = document.getElementById('player');
    var origin = location.protocol + '//' + location.host;
    var url;

    if (!videoId || !player) {
        return;
    }

    url = 'https://www.youtube.com/embed/' +
        encodeURIComponent(videoId) +
        '?autoplay=1' +
        '&controls=0' +
        '&fs=0' +
        '&rel=0' +
        '&disablekb=1' +
        '&playsinline=1' +
        '&loop=1' +
        '&playlist=' + encodeURIComponent(videoId) +
        '&enablejsapi=1' +
        '&origin=' + encodeURIComponent(origin);

    player.src = url;
}());
</script>
</body>
</html>
