<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <style>
        html,
        body {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
        }

        #youtube-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        #player {
            position: absolute;
            top: -12%;
            left: -4%;
            width: 108%;
            height: 124%;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: #000000;
            pointer-events: none;
        }

        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }
    </style>
</head>

<body>
    <div id="youtube-viewport">
        <iframe
            id="player"
            src="about:blank"
            frameborder="0"
            scrolling="no"
            tabindex="-1"
            aria-hidden="true"
            allow="autoplay; encrypted-media"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
    </div>

    <script>
    (function () {
        var match = location.search.match(/[?&]v=([^&]+)/);
        var videoId = match ? decodeURIComponent(match[1]) : '';
        var player = document.getElementById('player');
        var origin = location.protocol + '//' + location.host;
        var url;

        if (!videoId || !player) {
            return;
        }

        url =
            'https://www.youtube.com/embed/' +
            encodeURIComponent(videoId) +
            '?autoplay=1' +
            '&controls=0' +
            '&disablekb=1' +
            '&fs=0' +
            '&iv_load_policy=3' +
            '&playsinline=1' +
            '&rel=0' +
            '&loop=1' +
            '&playlist=' + encodeURIComponent(videoId) +
            '&origin=' + encodeURIComponent(origin);

        player.src = url;
        player.setAttribute('tabindex', '-1');
        player.blur();

        document.addEventListener('focusin', function (event) {
            if (event.target === player) {
                player.blur();
            }
        }, false);

        document.addEventListener('mousedown', function (event) {
            event.preventDefault();
        }, false);

        document.addEventListener('touchstart', function (event) {
            event.preventDefault();
        }, false);
    }());
    </script>
</body>
</html>
